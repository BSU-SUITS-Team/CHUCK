version: "3.8"

services:
  tss:
    build: ./TSS2026
    ports:
      - "14141:14141/tcp"
      - "14141:14141/udp"
    stdin_open: true
    tty: true

  groundcontrol-api:
    command: sh -c "sleep 3; uvicorn app.main:app --host 0.0.0.0 --port 8181"
    build: ./groundcontrol-api
    depends_on:
      - tss
      - groundcontrol-db
    ports:
      - 8181:8181
    environment:
      - TSS_ENDPOINT=http://tss:14141
      - OLLAMA_ENDPOINT=http://host.docker.internal:11434
  lmcc:
    build: ./LMCC
    ports:
      - 3000:3000
  groundcontrol-db:
    build: ./groundcontrol-db # use latest official postgres version
    env_file:
      - ./groundcontrol-db/database.env # configure postgres
    ports:
      - "5432:5432"
